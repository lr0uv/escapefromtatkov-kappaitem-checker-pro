# 一時的な調査用（本番の新機能の確認）。調査が終わったらブランチごと消す
name: Probe data
on:
  push:
    branches: [claude/probe-data]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS --compressed -m 60 'https://kappacontainer.com/api/items.php?mode=regular' -o live.json
          python3 - <<'PY'
          import json
          d=json.load(open('live.json')); r=d['requirements']
          print('items', len(d['items']), 'level', r['level'])
          for t in r['traders']: print('trader', t['name'], t['level'])
          for t in r['tasks']: print('task', t['name'], t['trader']['en'], t['level'], t['wiki'])
          PY
          for u in sw.js privacy.html en/privacy.html en/ sitemap.xml; do curl -sS -m 30 -o /dev/null -w "$u %{http_code} %{content_type}\n" https://kappacontainer.com/$u; done
          for m in regular; do curl -sS --compressed -m 60 -o /dev/null -w "traders_ja %{http_code}\n" https://json.tarkov.dev/$m/traders_ja; done
          curl -sS --compressed -m 60 https://json.tarkov.dev/regular/traders_ja | head -c 300; echo
